# asound.conf - ALSA configuration for the Nintendo 3DS (CyanogenMod 7.2)
#
# The port's kernel driver (drivers/platform/nintendo3ds/ctr_snd.c) registers a
# single ALSA PCM playback card, card 0, device 0:
#
#   * the codec is a TSC2117/AIC3010 initialised from ctr_tsc_probe();
#   * the samples come from the CSND hardware on the I2S2 line (no DSP
#     firmware), and the card accepts S16_LE stereo at 8-48 kHz.
#
# CyanogenMod's ALSA HAL (hardware/alsa_sound/alsa_default.cpp) first tries a
# device name built from the stream + route + mode ("AndroidPlayback_Speaker_normal"),
# then peels the suffixes off one at a time and finally falls back to "default".
# Our card has no hardware mixer controls (the volume/routing is programmed by
# the kernel during codec bring-up), so every name just has to resolve to hw:0,0.
#
# Explicit `type hw` (not the ALSA `plug`/`default` plugins) avoids loading any
# plugin .so that Android's alsa-lib build does not ship.

pcm.!default {
    type hw
    card 0
}

ctl.!default {
    type hw
    card 0
}

# Playback names tried by AudioHardwareALSA (after suffix stripping).
pcm.AndroidPlayback {
    type hw
    card 0
}

pcm.AndroidPlayback_Speaker_normal {
    type hw
    card 0
}

pcm.AndroidPlayback_Speaker_ringtone {
    type hw
    card 0
}

pcm.AndroidPlayback_Speaker_incall {
    type hw
    card 0
}

pcm.AndroidPlayback_Headset_normal {
    type hw
    card 0
}

# Capture names: the card is playback-only, so these intentionally point at
# hw:0,0 and will simply fail to open (there is no microphone path yet).
pcm.AndroidCapture {
    type hw
    card 0
}

# Mixer devices ALSAMixer attaches to (then falls back to hw:00 anyway).
ctl.AndroidOut {
    type hw
    card 0
}

ctl.AndroidIn {
    type hw
    card 0
}
