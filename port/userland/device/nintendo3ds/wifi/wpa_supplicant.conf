# wpa_supplicant.conf - Nintendo 3DS (CyanogenMod 7.2)
#
# Template copied to /system/etc/wifi/wpa_supplicant.conf.  On first Wi-Fi
# enable, libhardware_legacy's wifi.c copies it to
# /data/misc/wifi/wpa_supplicant.conf (owned by wifi:wifi) and wpa_supplicant
# then reads/writes that copy (update_config=1).
#
# The 3DS Wi-Fi is an Atheros AR6014G driven by mainline ath6kl (cfg80211 +
# CONFIG_CFG80211_WEXT), so the supplicant runs with the "wext" driver.  The
# control socket is the one init.rc declares with
#   socket wpa_wlan0 dgram 660 wifi wifi
# -- wpa_supplicant_6's Android build uses the interface name as the control
# interface name.

update_config=1
ctrl_interface=wlan0
eapol_version=1
ap_scan=1
fast_reauth=1
